<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Project Kickoff Checklist Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #e8f0ff 0%, #d3e2ff 100%);
    font-family: system-ui, sans-serif;
    color: #1e2a4a;
    display: flex;
    justify-content: center;
    padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 560px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; color: #24408e; font-weight: 800; text-align: center; }
  .subtitle { color: #4a5b8c; margin-bottom: 24px; font-size: 0.9rem; text-align: center; }
  .card { background: #fff; border-radius: 16px; padding: 28px 26px; box-shadow: 0 8px 24px rgba(30,42,74,0.1); }
  textarea {
    width: 100%; min-height: 100px; padding: 12px 14px; border-radius: 10px;
    border: 2px solid #b9cbf5; font-family: inherit; font-size: 1rem; margin-bottom: 14px; resize: vertical;
  }
  button.action {
    padding: 12px 28px; border: none; border-radius: 999px; font-size: 1rem; font-weight: 700;
    font-family: inherit; cursor: pointer; background: #24408e; color: #fff; display: block; margin: 0 auto;
  }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #5a6a94; min-height: 1.2em; text-align: center; }
  .section { margin-top: 20px; }
  .section h2 { font-size: 1rem; color: #24408e; margin: 0 0 8px; }
  .section ul { margin: 0; padding-left: 20px; }
  .section li { margin-bottom: 6px; line-height: 1.4; }
  .footer-note { color: #5a6a94; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block; width: 13px; height: 13px; border: 2px solid #cdd9f7;
    border-top-color: #24408e; border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>📋 Project Kickoff Checklist Generator</h1>
    <p class="subtitle">Describe your project, get a grounded kickoff checklist. 100% on-device.</p>

    <div class="card">
      <textarea id="mainInput" placeholder="e.g. We're launching a mobile app redesign for our fitness brand, targeting release in 3 months with a small design + engineering team."></textarea>
      <button class="action" id="generateBtn">Build Checklist</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const mainInput = document.getElementById('mainInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    function renderList(title, items) {
      if (!items || !items.length) return '';
      return `<div class="section"><h2>${escapeHtml(title)}</h2><ul>${items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul></div>`;
    }

    async function generate() {
      const value = mainInput.value.trim();
      if (!value) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Thinking through your kickoff...';

      try {
        const res = await fetch('/api/kickoff', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ description: value }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML =
          renderList('Stakeholders to Loop In', data.stakeholders) +
          renderList('First Decisions to Make', data.decisions) +
          renderList('Early Risks to Flag', data.risks);
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
  </script>
</body>
</html>
